<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mobile-bim-viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      background: #1c1c22;
      color: #e8ebf0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    #topbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: #121212;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 20;
      border-bottom: 1px solid #2f3744;
    }

    #topbar-title {
      display: flex;
      align-items: center;
      min-width: 0;
      color: #f4f6fb;
    }
    #topbar-title h1 {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #topbar-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-btn {
      background: #1e1e24;
      border: 1px solid #3a4250;
      border-radius: 10px;
      width: 48px;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s, transform 0.15s;
      flex-shrink: 0;
      position: relative;
    }
    .topbar-btn .icon { font-size: 1.1rem; line-height: 1; }
    .topbar-btn .label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .topbar-btn.active {
      background: #273548;
      border-color: #5c88fc;
      box-shadow: 0 0 0 1px rgba(92,136,252,0.18) inset;
    }
    .topbar-btn.disabled {
      opacity: 0.34;
      filter: grayscale(0.7);
      cursor: not-allowed;
    }
    .topbar-btn.disabled:hover,
    .topbar-btn.disabled:active {
      background: #1e1e24;
      border-color: #3a4250;
      transform: none;
    }
    .topbar-btn.settings-btn {
      width: 52px;
      height: 52px;
      border-radius: 12px;
    }

    .side-popup {
      position: absolute;
      top: 76px;
      left: 12px;
      right: 12px;
      width: auto;
      background: #171b22;
      border: 1px solid #2f3744;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.42);
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 14px;
      max-height: calc(100vh - 92px);
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.68rem;
      color: #aeb8c7;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .instructions {
      font-size: 0.72rem;
      color: #97a2b4;
      line-height: 1.6;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.8rem;
      color: #d5dbe6;
      padding: 10px 12px;
      border-radius: 10px;
      background: #12151b;
      border: 1px solid #2f3744;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: #2f3744; transition: .2s; border-radius: 999px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #5c88fc; }
    input:checked + .slider:before { transform: translateX(18px); }

    .settings-card {
      background: #12151b;
      border: 1px solid #2f3744;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vc-title {
      font-size: 0.72rem;
      color: #c5cedd;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .vc-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }
    .btn-vc {
      min-height: 38px;
      background: #1a1f28;
      border: 1px solid #313a49;
      color: #eef1f6;
      border-radius: 8px;
      padding: 8px 0;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-vc:active { transform: scale(0.98); }
    .vc-top { grid-column: 2 / 3; }
    .vc-left { grid-column: 1 / 2; }
    .vc-front { grid-column: 2 / 3; }
    .vc-right { grid-column: 3 / 4; }
    .vc-back { grid-column: 1 / 2; }
    .vc-home { grid-column: 2 / 4; background: #8a97aa; border-color: #8a97aa; color: #fff; }

    .bg-picker-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
      gap: 12px;
    }
    .bg-swatch {
      width: 26px;
      height: 26px;
      border: 1px solid #3d4757;
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    #viewer {
      position: absolute;
      top: 64px;
      left: 0;
      width: 100%;
      height: calc(100vh - 64px);
      touch-action: none;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; outline: none; }

    #viewer-notice {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 8;
      pointer-events: none;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 1px 6px rgba(0,0,0,0.55);
      letter-spacing: -0.01em;
    }

    #center-copyright {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 7;
      pointer-events: none;
      color: rgba(180, 180, 180, 0.45);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }

    #drop-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #8a93a3; pointer-events: none; z-index: 5;
    }
    #drop-overlay.hidden { display: none; }

    #loading {
      display: none; position: absolute; inset: 0; background: rgba(43,47,56,0.7);
      align-items: center; justify-content: center; color: #8a97aa; font-size: 1rem; z-index: 30;
    }
    #loading.visible { display: flex; }

    #axis-badge {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: none;
      pointer-events: none; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem;
      font-weight: 600; background: rgba(30,120,60,.86); color: #b6ffbe; z-index: 10;
    }
    #axis-badge.z { background: rgba(120,30,30,.86); color: #ffbaba; }
  </style>
</head>
<body>
  <header id="topbar">
    <div id="topbar-title">
      <h1>모듈러 BIM 뷰어</h1>
    </div>
    <div id="topbar-tools">
      <button class="topbar-btn disabled" id="btn-toggle-file" aria-disabled="true" title="파일 관리 비활성화">
        <span class="icon">📁</span><span class="label">파일 관리</span>
      </button>
      <button class="topbar-btn disabled" id="btn-distance" aria-disabled="true" title="거리 측정 비활성화">
        <span class="icon">📏</span><span class="label">거리 측정</span>
      </button>
      <button class="topbar-btn disabled" id="btn-markup" aria-disabled="true" title="주석/마크업 비활성화">
        <span class="icon">✏️</span><span class="label">주석/마크업</span>
      </button>
      <button class="topbar-btn disabled" id="btn-schedule" aria-disabled="true" title="일람표 비활성화">
        <span class="icon">📑</span><span class="label">일람표</span>
      </button>
      <button class="topbar-btn settings-btn" id="btn-toggle-settings" title="환경 설정">
        <span class="icon">⚙️</span><span class="label">환경 설정</span>
      </button>
    </div>
  </header>

  <div id="settings-popup" class="side-popup">
    <div class="section-title">환경 설정</div>

    <div class="settings-card">
      <div class="toggle-row">
        <span>모델 외곽선 표시</span>
        <label class="switch">
          <input type="checkbox" id="edge-enable" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="instructions">외곽선을 끄면 일부 대형 모델에서 렌더링 성능이 좋아질 수 있습니다.</div>
    </div>

    <div class="settings-card">
      <div class="vc-title">뷰 전환</div>
      <div class="vc-grid">
        <button class="btn-vc vc-top" id="vc-top">TOP</button>
        <button class="btn-vc vc-left" id="vc-left">LEFT</button>
        <button class="btn-vc vc-front" id="vc-front">FRONT</button>
        <button class="btn-vc vc-right" id="vc-right">RIGHT</button>
        <button class="btn-vc vc-back" id="vc-back">BACK</button>
        <button class="btn-vc vc-home" id="vc-home">HOME</button>
      </div>
      <div class="bg-picker-row">
        <div class="instructions">배경 색상</div>
        <div class="bg-swatch" onclick="document.getElementById('bg-color').click()">
          <div id="bg-color-display" style="width:100%;height:100%;background:#1c1c22;pointer-events:none;"></div>
          <input type="color" id="bg-color" value="#1c1c22" style="position:absolute;opacity:0;width:0;height:0;border:none;">
        </div>
      </div>
    </div>

    <div class="settings-card">
      <div class="instructions">
        모바일 최적화 상태입니다.<br>
        한 손가락: 회전<br>
        두 손가락: 확대/축소 및 이동
      </div>
    </div>
  </div>

  <main id="viewer">
    <div id="viewer-notice">모바일 최적화로 인해 일부 기능이 제한됩니다</div>
    <div id="center-copyright">© 2026 Jeewon Choi</div>
    <canvas id="three-canvas"></canvas>
    <div id="drop-overlay" class="hidden" aria-hidden="true"></div>
    <div id="loading">⏳ 로딩 중...</div>
    <div id="axis-badge"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>

  <script>
    const ACI_COLORS=["#000000","#ff0000","#ffff00","#00ff00","#00ffff","#0000ff","#ff00ff","#ffffff","#414141","#808080","#ff0000","#ffaaaa","#bd0000","#bd7e7e","#810000","#815656","#680000","#684545","#450000","#452e2e","#ff3f00","#ffbfaa","#bd2e00","#bd8d7e","#811f00","#816056","#681900","#684d45","#451100","#45332e","#ff7f00","#ffd4aa","#bd5e00","#bd9d7e","#814000","#816b56","#683300","#685645","#452200","#45392e","#ffbf00","#ffeaaa","#bd8d00","#bdad7e","#816000","#817656","#684d00","#685f45","#453300","#453f2e","#ffff00","#ffffaa","#bdbd00","#bdbd7e","#818100","#818156","#686800","#686845","#454500","#45452e","#bfff00","#eaffaa","#8dbd00","#adbd7e","#608100","#768156","#4d6800","#5f6845","#334500","#3f452e","#7fff00","#d4ffaa","#5ebd00","#9dbd7e","#408100","#6b8156","#336800","#566845","#224500","#39452e","#3fff00","#bffffa","#2ebd00","#8dbd7e","#1f8100","#608156","#196800","#4d6845","#114500","#33452e","#00ff00","#aaffaa","#00bd00","#7ebd7e","#008100","#568156","#006800","#456845","#004500","#2e452e","#00ff3f","#aaffbf","#00bd2e","#7ebd8d","#00811f","#568160","#006819","#45684d","#004511","#2e4533","#00ff7f","#aaffd4","#00bd5e","#7ebd9d","#008140","#56816b","#006833","#456856","#004522","#2e4539","#00ffbf","#aaffe5","#00bd8d","#7ebdad","#008160","#568176","#00684d","#45684f","#004533","#2e453f","#00ffff","#aaffff","#00bdbd","#7ebdbd","#008181","#568181","#006868","#456868","#004545","#2e4545","#00bfff","#aaeaff","#008dbd","#7eadbd","#006081","#567681","#004d68","#455f68","#003345","#2e3f45","#007fff","#aad4ff","#005ebd","#7e9dbd","#004081","#566b81","#003368","#455668","#002245","#2e3945","#003fff","#aabfff","#002ebd","#7e8dbd","#001f81","#566081","#001968","#454d68","#001145","#2e3345","#0000ff","#aaaaff","#0000bd","#7e7ebd","#000081","#565681","#000068","#454568","#000045","#2e2e45","#3f00ff","#bfaaff","#2e00bd","#8d7ebd","#1f0081","#605681","#190068","#4d4568","#110045","#332e45","#7f00ff","#d4aaff","#5e00bd","#9d7ebd","#400081","#6b5681","#330068","#564568","#220045","#392e45","#bf00ff","#eaaaff","#8d00bd","#ad7ebd","#600081","#765681","#4d0068","#5f4568","#330045","#3f2e45","#ff00ff","#ffaaff","#bd00bd","#bd7ebd","#810081","#815681","#680068","#684568","#450045","#452e45","#ff00bf","#ffaaea","#bd008d","#bd7ead","#810060","#815676","#68004d","#68455f","#450033","#452e3f","#ff007f","#ffaad4","#bd005e","#bd7e9d","#810040","#81566b","#680033","#684556","#450022","#452e39","#ff003f","#ffaabf","#bd002e","#bd7e8d","#81001f","#815660","#680019","#68454d","#450011","#452e33","#333333","#505050","#696969","#828282","#9c9c9c","#b5b5b5","#cecece","#e7e7e7","#ffffff"];
    function getHexColorFromIndex(i) { return (i>=0 && i<ACI_COLORS.length) ? ACI_COLORS[i] : "#ffffff"; }

    function DXFToThree(dxf) {
      const container = new THREE.Group();
      if (dxf.tables && dxf.tables.layer && dxf.tables.layer.layers) {
        Object.entries(dxf.tables.layer.layers).forEach(([name, info]) => {
          container.userData = container.userData || {};
          container.userData.layers = container.userData.layers || {};
          container.userData.layers[name] = { colorHex: getHexColorFromIndex(info.color||7), materials: [] };
        });
      }
      dxf.entities.forEach(ent => {
        const lname = ent.layer || '0';
        container.userData.layers = container.userData.layers || {};
        if (!container.userData.layers[lname]) container.userData.layers[lname] = { colorHex: '#ffffff', materials: [] };
        const hex = ent.colorIndex ? getHexColorFromIndex(ent.colorIndex) : container.userData.layers[lname].colorHex;
        const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(hex) });
        container.userData.layers[lname].materials.push(mat);

        if (ent.type === 'LINE' && ent.vertices && ent.vertices.length >= 2) {
          const geo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(ent.vertices[0].x, ent.vertices[0].z||0, ent.vertices[0].y),
            new THREE.Vector3(ent.vertices[1].x, ent.vertices[1].z||0, ent.vertices[1].y)
          ]);
          container.add(new THREE.Line(geo, mat));
        } else if ((ent.type === 'LWPOLYLINE' || ent.type === 'POLYLINE') && ent.vertices) {
          const pts = ent.vertices.map(v => new THREE.Vector3(v.x, v.z||0, v.y));
          if (ent.shape && pts.length) pts.push(pts[0].clone());
          container.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
        } else if ((ent.type === 'CIRCLE' || ent.type === 'ARC') && ent.center) {
          const pts = [];
          const s = ent.startAngle || 0;
          const e = ent.endAngle || (Math.PI * 2);
          for (let i=0; i<=32; i++) {
            const th = s + (e-s)*(i/32);
            pts.push(new THREE.Vector3(ent.center.x + Math.cos(th)*ent.radius, ent.center.z||0, ent.center.y + Math.sin(th)*ent.radius));
          }
          container.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
        }
      });
      return container;
    }

    const canvas = document.getElementById('three-canvas');
    const viewer = document.getElementById('viewer');
    const loadingEl = document.getElementById('loading');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, logarithmicDepthBuffer: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500000);
    camera.position.set(12, 12, 12);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
    controls.mouseButtons = { LEFT: null, MIDDLE: null, RIGHT: null };

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dl1 = new THREE.DirectionalLight(0xffffff, 0.85); dl1.position.set(20,40,20); scene.add(dl1);
    const dl2 = new THREE.DirectionalLight(0xaaccff, 0.35); dl2.position.set(-20,10,-20); scene.add(dl2);

    const roots = [];

    function resize() {
      renderer.setSize(viewer.clientWidth, viewer.clientHeight);
      camera.aspect = viewer.clientWidth / viewer.clientHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    function setModelEdgesVisible(visible) {
      roots.forEach(root => root.traverse(child => {
        if (child.userData && child.userData.isModelEdge) child.visible = visible;
      }));
    }

    function fitCameraToScene() {
      if (!roots.length) return;
      const box = new THREE.Box3();
      roots.forEach(r => box.expandByObject(r));
      if (box.isEmpty()) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z, 1);
      const fovRad = camera.fov * (Math.PI / 180);
      let dist = (maxDim / 2) / Math.tan(fovRad / 2);
      dist *= 2.2;
      camera.far = Math.max(500000, dist * 10);
      camera.updateProjectionMatrix();
      controls.maxDistance = dist * 10;
      camera.position.set(center.x + dist * 0.7, center.y + dist * 0.6, center.z + dist * 0.7);
      controls.target.copy(center);
      controls.update();
    }

    function finalizeLoad(obj) {
      scene.add(obj);
      roots.push(obj);
      fitCameraToScene();
      setModelEdgesVisible(document.getElementById('edge-enable').checked);
    }

    function processLoadedOBJ(obj, filename) {
      obj.userData.name = filename;
      const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1 });
      obj.traverse(c => {
        if (c.isMesh) {
          if (!c.material) c.material = new THREE.MeshStandardMaterial({ color: '#2f887b', metalness: 0.1, roughness: 0.6 });
          else if (!Array.isArray(c.material)) c.material.color && c.material.color.set('#2f887b');
          const edgesGeo = new THREE.EdgesGeometry(c.geometry, 25);
          const line = new THREE.LineSegments(edgesGeo, edgeMaterial);
          line.userData.isModelEdge = true;
          c.add(line);
        }
      });
      finalizeLoad(obj);
    }

    function processLoadedGLTF(gltf, filename) {
      const obj = gltf.scene || gltf.scenes[0];
      obj.userData.name = filename;
      obj.scale.set(1000, 1000, 1000);
      const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1 });
      obj.traverse(c => {
        if (c.isMesh) {
          const edgesGeo = new THREE.EdgesGeometry(c.geometry, 25);
          const line = new THREE.LineSegments(edgesGeo, edgeMaterial);
          line.userData.isModelEdge = true;
          c.add(line);
        }
      });
      finalizeLoad(obj);
    }

    function processLoadedDXF(dxfObj, filename) {
      const obj = DXFToThree(dxfObj);
      obj.userData.name = filename;
      obj.traverse(c => { if (c.isLine) c.frustumCulled = false; });
      finalizeLoad(obj);
    }

    async function loadModelFromURL(url, filename) {
      try {
        loadingEl.classList.add('visible');
        const ext = filename.split('.').pop().toLowerCase();
        if (ext === 'glb' || ext === 'gltf') {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const buffer = await response.arrayBuffer();
          new THREE.GLTFLoader().parse(buffer, '', gltf => processLoadedGLTF(gltf, filename.replace(/\.[^/.]+$/, '')));
        } else {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const text = await response.text();
          if (ext === 'obj') {
            processLoadedOBJ(new THREE.OBJLoader().parse(text), filename.replace(/\.[^/.]+$/, ''));
          } else if (ext === 'dxf') {
            processLoadedDXF(new DxfParser().parseSync(text), filename.replace(/\.[^/.]+$/, ''));
          } else if (ext === 'json') {
            const data = JSON.parse(text);
            if (Array.isArray(data)) {
              for (const item of data) {
                if (item.type === 'obj' && item.rawContent) processLoadedOBJ(new THREE.OBJLoader().parse(item.rawContent), item.name || 'OBJ');
                else if (item.type === 'dxf' && item.rawContent) processLoadedDXF(new DxfParser().parseSync(item.rawContent), item.name || 'DXF');
                else if (item.type === 'gltf' && item.rawContent) {
                  new THREE.GLTFLoader().parse(item.rawContent, '', gltf => processLoadedGLTF(gltf, item.name || 'GLTF'));
                }
              }
            }
          }
        }
      } catch (e) {
        console.warn(`자동 로드 실패: ${filename}`, e);
      } finally {
        loadingEl.classList.remove('visible');
      }
    }

    const duration = 600;
    let animStart = 0, animating = false;
    const startPos = new THREE.Vector3();
    const targetPos = new THREE.Vector3();
    const targetTarget = new THREE.Vector3();
    function smoothStep(t) { return t * t * (3 - 2 * t); }
    function startViewTransition(pos, target) {
      animStart = performance.now();
      startPos.copy(camera.position);
      targetPos.copy(pos);
      targetTarget.copy(target);
      animating = true;
      requestAnimationFrame(updateViewTransition);
    }
    function updateViewTransition(time) {
      if (!animating) return;
      let t = (time - animStart) / duration;
      if (t >= 1) {
        t = 1; animating = false;
        camera.position.copy(targetPos);
        controls.target.copy(targetTarget);
        controls.update();
      } else {
        const f = smoothStep(t);
        camera.position.lerpVectors(startPos, targetPos, f);
        controls.target.lerpVectors(controls.target, targetTarget, f);
        controls.update();
        requestAnimationFrame(updateViewTransition);
      }
    }
    function getCenter() {
      if (!roots.length) return new THREE.Vector3(0,0,0);
      const b = new THREE.Box3(); roots.forEach(r => b.expandByObject(r));
      return b.getCenter(new THREE.Vector3());
    }
    function getDist() {
      if (!roots.length) return 50;
      const b = new THREE.Box3(); roots.forEach(r => b.expandByObject(r));
      const s = b.getSize(new THREE.Vector3());
      const maxDim = Math.max(s.x, s.y, s.z, 1);
      const fovRad = camera.fov * (Math.PI / 180);
      return ((maxDim / 2) / Math.tan(fovRad / 2)) * 2.2;
    }

    document.getElementById('vc-top').onclick = () => { const d = getDist(), c = getCenter(); startViewTransition(new THREE.Vector3(c.x, c.y + d, c.z), c); };
    document.getElementById('vc-left').onclick = () => { const d = getDist(), c = getCenter(); startViewTransition(new THREE.Vector3(c.x - d, c.y, c.z), c); };
    document.getElementById('vc-front').onclick = () => { const d = getDist(), c = getCenter(); startViewTransition(new THREE.Vector3(c.x, c.y, c.z + d), c); };
    document.getElementById('vc-right').onclick = () => { const d = getDist(), c = getCenter(); startViewTransition(new THREE.Vector3(c.x + d, c.y, c.z), c); };
    document.getElementById('vc-back').onclick = () => { const d = getDist(), c = getCenter(); startViewTransition(new THREE.Vector3(c.x, c.y, c.z - d), c); };
    document.getElementById('vc-home').onclick = () => { const d = getDist(), c = getCenter(); startViewTransition(new THREE.Vector3(c.x + d*0.7, c.y + d*0.6, c.z + d*0.7), c); };

    document.getElementById('bg-color').addEventListener('input', e => {
      const hex = e.target.value;
      document.body.style.background = hex;
      document.getElementById('bg-color-display').style.backgroundColor = hex;
    });

    const settingsPopupEl = document.getElementById('settings-popup');
    const btnToggleSettings = document.getElementById('btn-toggle-settings');
    btnToggleSettings.addEventListener('click', () => {
      const willOpen = settingsPopupEl.style.display === 'none' || settingsPopupEl.style.display === '';
      settingsPopupEl.style.display = willOpen ? 'flex' : 'none';
      btnToggleSettings.classList.toggle('active', willOpen);
    });

    ['btn-toggle-file','btn-distance','btn-markup','btn-schedule'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
    });

    document.getElementById('edge-enable').addEventListener('change', e => setModelEdgesVisible(e.target.checked));

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const baseProjectUrl = '벽체, 보, 바닥.json';
        await loadModelFromURL(baseProjectUrl, baseProjectUrl);
      } catch (e) {
        console.warn('기본 프로젝트 자동 로드 실패:', e);
      }

      try {
        const response = await fetch('models.json');
        if (!response.ok) return;
        const modelFiles = await response.json();
        for (const file of modelFiles) {
          if (file === '벽체, 보, 바닥.json') continue;
          await loadModelFromURL(file, file);
        }
      } catch (e) {
        console.warn('models.json 자동 로드 실패:', e);
      }
    });
  </script>
</body>
</html>
